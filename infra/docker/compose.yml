services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project_assistant
      POSTGRES_USER: project_assistant
      POSTGRES_PASSWORD: project_assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - project-assistant-db:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../../.env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "project_assistant.worker.main"]
    env_file: ../../.env
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_AUTH_MODE: local
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  project-assistant-db:
    name: ${PROJECT_ASSISTANT_DB_VOLUME:-docker_project-assistant-db}
