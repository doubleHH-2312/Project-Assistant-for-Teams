name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --all-groups --locked
          pnpm install --frozen-lockfile
      - name: Static and unit gates
        run: make verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start deterministic demo
        run: |
          cp .env.example .env
          make demo
      - name: Browser acceptance
        run: make e2e
      - name: Container and HTTP smoke
        run: |
          make build-images
          make smoke
      - name: Stop demo
        if: always()
        run: |
          if [ -f .env ]; then
            make down
          fi
